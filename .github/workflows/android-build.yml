name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project from zip bundle
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f TESLER_Voice_First_Prototype.zip ]; then
            echo "Missing TESLER_Voice_First_Prototype.zip in repo root"
            exit 1
          fi

          mkdir -p /tmp/tesler-build
          unzip -q TESLER_Voice_First_Prototype.zip -d /tmp/tesler-build

          GRADLEW_PATH=$(find /tmp/tesler-build -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "No Android project with gradlew was found inside the zip."
            echo "Check whether the archive contains the full project source."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_ROOT"

      - name: Build debug APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesler-debug-apk
          path: |
            ${{ env.PROJECT_ROOT }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
